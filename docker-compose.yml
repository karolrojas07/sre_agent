version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "49090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "46686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "45672:5672"
      - "45673:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "41888:1888"   # pprof extension
      - "48888:8888"   # Prometheus metrics exposed by the collector
      - "48889:8889"   # Prometheus exporter metrics
      - "43133:13133" # health_check extension
      - "44317:4317"   # OTLP gRPC receiver
      - "44318:4318"   # OTLP HTTP receiver
      - "45679:55679" # zpages extension
    depends_on:
      - jaeger
      - prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "43000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin

  interpreter-gateway:
    image: python:3.9-slim
    container_name: interpreter-gateway
    command: >
      bash -c "pip install fastapi uvicorn aio-pika opentelemetry-api opentelemetry-sdk opentelemetry-instrumentation-fastapi opentelemetry-exporter-otlp pydantic && python main.py"
    working_dir: /app
    volumes:
      - ./services/interpreter_gateway:/app
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    ports:
      - "48000:8000"
    depends_on:
      - rabbitmq
      - otel-collector

  validation-agent:
    image: python:3.9-slim
    container_name: validation-agent
    command: >
      bash -c "pip install aio-pika opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp pydantic && python main.py"
    working_dir: /app
    volumes:
      - ./services/validation_agent:/app
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - rabbitmq
      - otel-collector

  mock-jira-agent:
    image: python:3.9-slim
    container_name: mock-jira-agent
    command: >
      bash -c "pip install aio-pika opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp pydantic && python main.py"
    working_dir: /app
    volumes:
      - ./services/mock_jira_agent:/app
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - rabbitmq
      - otel-collector

  code-investigator:
    image: python:3.9-slim
    container_name: code-investigator
    command: >
      bash -c "pip install aio-pika opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp pydantic && python main.py"
    working_dir: /app
    volumes:
      - ./services/code_investigator:/app
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - rabbitmq
      - otel-collector

volumes:
  prometheus_data:
  grafana_data:
